<title>Stockshark Bot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the board owns the left and sets the scale, with a thin evaluation bar on its
   edge; a scoresheet column on the right carries the status, the engine readout, Stockshark's
   plan, the notation and the controls, and drops under the board on phones. */
:root {
  --bg: #e7eaee;
  --surface: #f5f6f8;
  --ink: #18212b;
  --muted: #5a6877;
  --line: #c7ced6;
  --brass: #8f5d0b;
  --brass-wash: rgba(226, 164, 40, .58);
  --brass-solid: rgba(226, 164, 40, .9);
  --brass-tint: rgba(226, 164, 40, .14);
  --sq-light: #e2e6ea;
  --sq-dark: #8195a9;
  --hint: rgba(18, 28, 40, .26);
  --check-core: rgba(214, 48, 36, .95);
  --check-mid: rgba(214, 48, 36, .55);
  --danger: #b93a2b;
  --on-danger: #fff7f5;
  --ok: #2c7655;
  --piece-white: #fbfbf9;
  --piece-black: #1d2329;
  --scrim: rgba(231, 234, 238, .64);
  --shade: rgba(10, 16, 24, .3);
  --shadow: 0 1px 2px rgba(24, 33, 43, .08), 0 12px 32px rgba(24, 33, 43, .13);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --side: 320px;
  --bar: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151a; --surface: #192027; --ink: #e7ebef; --muted: #93a0ad; --line: #2d3743;
    --brass: #e3ab45; --brass-wash: rgba(226, 164, 40, .5); --brass-solid: rgba(226, 164, 40, .85); --brass-tint: rgba(226, 164, 40, .12);
    --sq-light: #cdd4db; --sq-dark: #6d8196; --hint: rgba(18, 28, 40, .3);
    --danger: #d9513f; --on-danger: #fff7f5; --ok: #5cc196; --scrim: rgba(17, 21, 26, .66); --shade: rgba(0, 0, 0, .5);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151a; --surface: #192027; --ink: #e7ebef; --muted: #93a0ad; --line: #2d3743;
  --brass: #e3ab45; --brass-wash: rgba(226, 164, 40, .5); --brass-solid: rgba(226, 164, 40, .85); --brass-tint: rgba(226, 164, 40, .12);
  --sq-light: #cdd4db; --sq-dark: #6d8196; --hint: rgba(18, 28, 40, .3);
  --danger: #d9513f; --on-danger: #fff7f5; --ok: #5cc196; --scrim: rgba(17, 21, 26, .66); --shade: rgba(0, 0, 0, .5);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.app {
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 28px;
  max-width: 1160px;
  margin-inline: auto;
  padding-inline: 16px;
  padding-block: 20px;
}
.table {
  flex: 0 1 auto;
  min-width: 0;
  width: max(280px, min(740px, calc(100vh - 128px)));
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.side {
  flex: 0 0 var(--side);
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.sheet {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Player strips line up with the board, not the evaluation bar */
.player { display: flex; align-items: center; gap: 9px; min-height: 28px; padding-left: calc(var(--bar) + 8px); }
.chip { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--muted); }
.chip.w { background: var(--piece-white); }
.chip.b { background: var(--piece-black); }
.who { margin-right: auto; font: 600 15px/1.2 var(--font-display); }
.player.turn .who::after {
  content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 8px;
  border-radius: 50%; background: var(--brass); vertical-align: 1px;
}
.taken {
  display: flex; flex-wrap: wrap; justify-content: flex-end; min-width: 0;
  padding: 1px 5px 1px 11px; border-radius: 4px; background: var(--sq-light);
}
.taken:empty { display: none; }
.taken img { width: 20px; height: 20px; margin-left: -7px; }
.plus { min-width: 3ch; text-align: right; color: var(--muted); font: 500 12px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.plus:empty { display: none; }

/* Board and evaluation bar */
.board-row { display: grid; grid-template-columns: var(--bar) minmax(0, 1fr); gap: 8px; }
.evalbar {
  position: relative; border-radius: 3px; overflow: hidden;
  background: var(--piece-black); box-shadow: inset 0 0 0 1px var(--line);
}
.evalbar.idle { opacity: .35; }
.evalfill {
  position: absolute; left: 0; right: 0; bottom: 0; height: 50%;
  background: var(--piece-white); transition: height .5s ease;
}
.evalbar.flipped .evalfill { top: 0; bottom: auto; }
.board {
  position: relative;
  display: grid;
  grid-template: repeat(8, 1fr) / repeat(8, 1fr);
  width: 100%;
  max-width: 100%;
  aspect-ratio: 1;
  border-radius: 5px;
  overflow: hidden;
  box-shadow: var(--shadow);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.sq { position: relative; }
.sq.light { background: var(--sq-light); color: var(--sq-dark); }
.sq.dark { background: var(--sq-dark); color: var(--sq-light); }
.sq.grab { cursor: grab; }
.sq.hint { cursor: pointer; }
.sq::before { content: ""; position: absolute; inset: 0; }
.sq.last::before { background: var(--brass-wash); }
.sq.sel::before { background: var(--brass-solid); }
.sq.check::before { background: radial-gradient(circle at center, var(--check-core) 0%, var(--check-mid) 42%, transparent 74%); }
.sq.hint::after { content: ""; position: absolute; inset: 36%; border-radius: 50%; background: var(--hint); }
.sq.hint.cap::after { inset: 4%; background: none; border: max(3px, .55vmin) solid var(--hint); }
.coord { position: absolute; font: 600 10px/1 var(--font-mono); pointer-events: none; }
.coord.rank { top: 3px; left: 3px; }
.coord.file { right: 4px; bottom: 3px; }
.piece { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.sq.lift .piece { opacity: .25; }
.ghost {
  position: fixed; left: 0; top: 0; z-index: 20; max-width: none;
  pointer-events: none; filter: drop-shadow(0 5px 5px var(--shade));
}

/* Promotion picker and result card sit on top of the board */
.promo { position: absolute; inset: 0; z-index: 5; background: var(--scrim); }
.promo-col { position: absolute; top: 0; width: 12.5%; height: 50%; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.promo-col.up { flex-direction: column-reverse; }
.promo-col button { flex: 1; padding: 0; border: 0; border-radius: 0; background: var(--sq-light); cursor: pointer; }
.promo-col button:hover, .promo-col button:focus-visible { background: var(--brass-solid); outline-offset: -2px; }
.promo-col img { display: block; width: 100%; height: 100%; }

.result { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 16px; background: var(--scrim); }
.card {
  max-width: min(320px, 100%); padding: 22px 26px; border-radius: 10px;
  background: var(--surface); color: var(--ink); text-align: center; box-shadow: var(--shadow);
}
.score { font: 700 clamp(40px, 9vmin, 64px)/1 var(--font-display); letter-spacing: -.02em; }
.card p { margin: 8px 0 16px; color: var(--muted); text-wrap: balance; }
.card .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

/* Side column */
.mast h1 { margin: 0; font: 700 30px/1.05 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
.mast p { margin: 6px 0 0; color: var(--muted); font-size: 14px; text-wrap: pretty; }

.status { min-height: 62px; padding-top: 10px; border-top: 2px solid var(--ink); }
.status .line { font: 600 19px/1.2 var(--font-display); text-wrap: balance; }
.status .note { margin-top: 3px; color: var(--muted); font-size: 13.5px; }

.pill {
  flex: none; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); font: 600 10.5px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .07em; white-space: nowrap;
}
.pill.ok { color: var(--ok); border-color: currentColor; }
.pill.busy { color: var(--brass); border-color: currentColor; background: var(--brass-tint); }
.pill.bad { color: var(--danger); border-color: currentColor; }

/* Engine readout: what Stockfish is looking at right now */
.engine { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.engine-head { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.engine-name { min-width: 0; margin-right: auto; color: var(--muted); font: 600 11px/1.45 var(--font-body); text-transform: uppercase; letter-spacing: .08em; }
.engine-eval { font: 600 22px/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.engine-stats { color: var(--muted); font: 500 12px/1.4 var(--font-mono); font-variant-numeric: tabular-nums; }
.engine-pv { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font: 500 12.5px/1.45 var(--font-mono); }
.engine-main { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.meter { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.meter-fill { height: 100%; width: 0; background: var(--brass); transition: width .25s linear; }

/* Stockshark's plan: the strategist's notebook. Collapsible to just its header. */
.claude {
  display: flex; flex-direction: column; gap: 8px; min-width: 0;
  padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--brass); border-radius: 6px; background: var(--surface);
}
.claude-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.claude-head h2 { margin: 0 auto 0 0; white-space: nowrap; font: 650 15px/1.2 var(--font-display); }
.claude-head .side-tag { color: var(--muted); font-weight: 500; }
.toggle {
  flex: none; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: none;
  color: var(--ink); font: 600 11.5px/1.2 var(--font-body); cursor: pointer;
}
.toggle:hover { border-color: var(--muted); }
.claude-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.plan { margin: 0; font-size: 14px; line-height: 1.5; text-wrap: pretty; overflow-wrap: anywhere; }
.plan:empty::before { content: "No plan yet. It appears here as soon as Stockshark makes its first move."; color: var(--muted); }
.remark { margin: 0; color: var(--muted); font-size: 13.5px; font-style: italic; overflow-wrap: anywhere; }
.remark:empty { display: none; }
.veto { margin: 0; padding: 6px 8px; border-radius: 4px; background: var(--brass-tint); font-size: 13px; overflow-wrap: anywhere; }
.connect { margin: 0; font-size: 13.5px; color: var(--muted); }
.connect code { padding: 1px 5px; border-radius: 4px; background: var(--bg); color: var(--ink); font: 500 12.5px/1.4 var(--font-mono); overflow-wrap: anywhere; }
.claude-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.claude-actions .btn { padding: 7px 10px; font-size: 13px; }

.scoresheet {
  flex: 1 1 141px; min-height: 141px;
  display: flex; flex-direction: column;
  border: 1px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden;
}
.scoresheet .head, .moves li { display: grid; grid-template-columns: 4ch 1fr 1fr; column-gap: 8px; padding-inline: 12px; }
.scoresheet .head {
  color: var(--muted); border-bottom: 1px solid var(--line);
  font: 600 11px/28px var(--font-body); text-transform: uppercase; letter-spacing: .08em;
}
.moves {
  flex: 1; min-height: 0; margin: 0; padding: 0; list-style: none; overflow-y: auto;
  font: 500 14px/27px var(--font-mono); font-variant-numeric: tabular-nums;
  background: repeating-linear-gradient(to bottom, transparent 0 27px, var(--line) 27px 28px) local;
}
.moves li { height: 28px; }
.moves .n { color: var(--muted); }
.moves .cur { color: var(--brass); font-weight: 600; }
.moves .final .m { font-weight: 600; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .wide { grid-column: 1 / -1; }
.btn {
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); font: 500 14px/1 var(--font-body); cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.armed { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }

.setup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.setup .wide { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { color: var(--muted); font: 600 11px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .08em; }
.field select {
  width: 100%; min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); font: 500 14px/1.2 var(--font-body);
}
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--brass); }
.credit { margin: 0; color: var(--muted); font-size: 12px; }
.credit a { color: inherit; }

@media (max-width: 760px) {
  :root { --bar: 8px; }
  .app { flex-direction: column; align-items: center; gap: 14px; }
  .side { display: contents; }
  .mast { order: -1; }
  .mast, .table, .sheet { width: 100%; max-width: 560px; }
  .sheet { flex: none; }
  .mast h1 { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  .evalfill, .meter-fill { transition: none; }
}
</style>

<div class="app">

    </div>
  </aside>
